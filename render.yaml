# Render Blueprint — statische site "Agrometeo Randwijk"
# Specificatie: https://render.com/docs/blueprint-spec
#
# Puur statische site: index.html met de modellen erin gebakken, geen backend
# en geen buildstap. Open-Meteo wordt rechtstreeks uit de browser opgehaald.

services:
  - type: web
    name: randwijk-agrometeo
    env: static                # statische site (breed ondersteund)
    buildCommand: "echo geen build nodig"
    staticPublishPath: .       # map waarin index.html staat (repo-root)
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
